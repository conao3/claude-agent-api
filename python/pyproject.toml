[project]
name = "claude-agent-api"
version = "0.1.0"
description = "Python client for Claude Agent API"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "gql[httpx]>=3.5.0",
    "websockets>=14.1",
    "pydantic>=2.10.5",
    "strawberry-graphql[cli]>=0.253.3",
]

[project.scripts]
claude-agent-api = "claude_agent_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_agent_api"]

[dependency-groups]
dev = [
    "ruff>=0.9.3",
]
