[project]
name = "claude-agent-api"
version = "0.1.0"
description = "Python client for Claude Agent API"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
    "strawberry-graphql[fastapi]>=0.338.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "claude-agent-sdk>=0.2.174",
    "anyio>=4.15.1",
]

[project.scripts]
claude-agent-api = "claude_agent_api.cli:main"
claude-agent-server = "claude_agent_api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_agent_api"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
